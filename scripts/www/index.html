    function getHosePrefix(model) {
        // 匹配开头字母数字部分，直到遇到两位数字结尾
        const match = model.match(/^([A-Z0-9]+?)\d{2}$/);
        if (match) return match[1];
        // fallback: 取前3或前4个字符
        if (model.startsWith('1SN') || model.startsWith('2SN')) return model.substring(0, 3);
        if (model.startsWith('4SH') || model.startsWith('4SP')) return model.substring(0, 4);
        if (model.startsWith('R15')) return 'R15';
        return model;
    }

    function getHoseCategories() {
        const set = new Set();
        hoseData.forEach(item => {
            const prefix = getHosePrefix(item.model);
            set.add(prefix);
        });
        // 按期望顺序排序: 1SN, 2SN, 4SH, 4SP, R15
        const order = ['1SN', '2SN', '4SH', '4SP', 'R15'];
        const sorted = Array.from(set).sort((a, b) => {
            const ia = order.indexOf(a);
            const ib = order.indexOf(b);
            if (ia !== -1 && ib !== -1) return ia - ib;
            if (ia !== -1) return -1;
            if (ib !== -1) return 1;
            return a.localeCompare(b);
        });
        return sorted;

        { code: "87691-16-12", thread: null, dn: 19, dash: "12", tube_od: null, L: 62, S1: null, H: 70, D: 47.6, L1: 9.53, flange: "1\"", category: "flange6k" },

        { code: "87691-20-16", thread: null, dn: 25, dash: "16", tube_od: null, L: 91.5, S1: null, H: 90, D: 54, L1: 10.29, flange: "1.1/4\"", category: "flange6k" },
        { code: "87691-24-20", thread: null, dn: 32, dash: "20", tube_od: null, L: 108, S1: null, H: 104, D: 63.5, L1: 12.57, flange: "1.1/2\"", category: "flange6k" },
        { code: "87691-24-24", thread: null, dn: 38, dash: "24", tube_od: null, L: 133.8, S1: null, H: 138, D: 63.5, L1: 12.57, flange: "1.1/2\"", category: "flange6k" },
        { code: "87691-32-24", thread: null, dn: 38, dash: "24", tube_od: null, L: 133.8, S1: null, H: 139, D: 79.4, L1: 12.57, flange: "2\"", category: "flange6k" },
        { code: "87691-32-32", thread: null, dn: 51, dash: "32", tube_od: null, L: null, S1: null, H: null, D: 79.4, L1: 12.57, flange: "2\"", category: "flange6k" }
    ];

    const fittingData = baseFitting.map(item => ({ ...item, angle: getAngleFromCode(item.code) }));

    // ============================================================
    //  DOM引用与状态
    // ============================================================
    const viewBtns = document.querySelectorAll('.view-btn');
    const hoseFilterGroup = document.getElementById('hoseFilterGroup');
    const fittingFilterBar = document.getElementById('fittingFilterBar');
    const tableWrapper = document.getElementById('tableWrapper');
    const tableHead = document.getElementById('tableHead');
    const tableBody = document.getElementById('tableBody');
    const resultCount = document.getElementById('resultCount');
    const activeHint = document.getElementById('activeHint');

    let currentView = 'hose';
    let currentHoseCategory = 'all';
    let currentCategory = 'all';
    let currentAngle = 'all';

    // ============================================================
    //  生成软管分类按钮 (使用前缀: 1SN, 2SN, 4SH, 4SP, R15)
    // ============================================================
    function buildHoseFilterButtons() {
        hoseFilterGroup.innerHTML = '<span class="label">型号：</span>';
        const allBtn = document.createElement('button');
        allBtn.className = 'filter-btn active';
        allBtn.dataset.type = 'hoseCategory';
        allBtn.dataset.value = 'all';
        allBtn.textContent = '全部';
        hoseFilterGroup.appendChild(allBtn);

        hoseCategories.forEach(cat => {
            const btn = document.createElement('button');
            btn.className = 'filter-btn';
            btn.dataset.type = 'hoseCategory';
            btn.dataset.value = cat;
            btn.textContent = cat;
            hoseFilterGroup.appendChild(btn);
        });

        // 绑定事件
        hoseFilterGroup.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                if (currentView !== 'hose') return;
                const type = this.dataset.type;
                if (type === 'hoseCategory') {
                    hoseFilterGroup.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentHoseCategory = this.dataset.value;
                    updateView();
                }
            });
        });
    }
    buildHoseFilterButtons();

    // ============================================================
    //  渲染函数
    // ============================================================
    function renderHose(data) {
        tableHead.innerHTML = `<tr>
            <th>型号</th><th>软管尺寸</th><th>内径 (mm)</th><th>外径 (mm)</th><th>最大工作压力 (MPa)</th><th>备注</th>
        </tr>`;
        if (!data || data.length === 0) {
            tableBody.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:40px;">无软管数据</td></tr>`;
            resultCount.textContent = '0';
            return;
        }
        let html = '';
        data.forEach(item => {
            html += `<tr>
                <td class="col-code">${item.model}</td>
                <td>${item.dash}</td>
                <td class="col-num">${item.inner}</td>
                <td class="col-num">${item.outer}</td>
                <td class="col-num">${item.pressure}</td>
                <td>${item.remark}</td>
            </tr>`;
        });
        tableBody.innerHTML = html;
        resultCount.textContent = data.length;
    }

    function renderFitting(data) {
        tableHead.innerHTML = `<tr>
            <th>代号</th><th>螺纹</th><th>DN</th><th>DASH</th><th>管子外径</th><th>L</th><th>S1</th><th>H</th><th>D</th><th>L1</th><th>法兰型号</th>
        </tr>`;
        if (!data || data.length === 0) {
            tableBody.innerHTML = `<tr><td colspan="11" style="text-align:center;padding:40px;">无接头数据</td></tr>`;
            resultCount.textContent = '0';
            return;
        }
        let html = '';
        data.forEach(item => {
            const isMetric = (item.category === 'light' || item.category === 'heavy');
            const showH = isMetric ? '' : (item.H ?? '');
            const showD = isMetric ? '' : (item.D ?? '');
            const showL1 = isMetric ? '' : (item.L1 ?? '');
            const showFlange = isMetric ? '' : (item.flange ?? '');
            html += `<tr>
                <td class="col-code">${item.code}</td>
                <td class="col-thread">${item.thread || '-'}</td>
                <td class="col-num">${item.dn}</td>
                <td class="col-num">${item.dash}</td>
                <td class="col-num">${item.tube_od ?? '-'}</td>
                <td class="col-num">${item.L ?? '-'}</td>
                <td class="col-num">${item.S1 ?? '-'}</td>
                <td class="col-num">${showH}</td>
                <td class="col-num">${showD}</td>
                <td class="col-num">${showL1}</td>
                <td>${showFlange}</td>
            </tr>`;
        });
        tableBody.innerHTML = html;
        resultCount.textContent = data.length;
    }

    function getFilteredHose() {
        if (currentHoseCategory === 'all') return hoseData;
        return hoseData.filter(item => item.model.startsWith(currentHoseCategory));
    }

    function getFilteredFitting() {
        let filtered = fittingData;
        if (currentCategory !== 'all') {
            filtered = filtered.filter(item => item.category === currentCategory);
        }
        if (currentAngle !== 'all') {
            filtered = filtered.filter(item => item.angle === currentAngle);
        }
        return filtered;
    }

    function updateView() {
        // 控制筛选栏显隐
        if (currentView === 'hose') {
            document.getElementById('hoseFilterBar').classList.add('visible');
            fittingFilterBar.classList.remove('visible');
        } else {
            document.getElementById('hoseFilterBar').classList.remove('visible');
            fittingFilterBar.classList.add('visible');
        }

        if (currentView === 'hose') {
            const data = getFilteredHose();
            renderHose(data);
            const catLabel = currentHoseCategory === 'all' ? '全部型号' : currentHoseCategory;
            activeHint.textContent = `软管 · ${catLabel} (共 ${data.length} 条)`;
        } else {
            const data = getFilteredFitting();
            renderFitting(data);
            const catLabel = currentCategory === 'all' ? '全部' :
                (currentCategory === 'light' ? '公制轻' :
                (currentCategory === 'heavy' ? '公制重' :
                (currentCategory === 'flange3k' ? '法兰3K' : '法兰6K')));
            const angleLabel = currentAngle === 'all' ? '全部角度' :
                (currentAngle === 'straight' ? '直头' :
                (currentAngle === '45' ? '45°' : '90°'));
            activeHint.textContent = `接头 · ${catLabel} · ${angleLabel} (共 ${data.length} 条)`;
        }
        tableWrapper.classList.add('visible');
    }

    // ============================================================
    //  事件绑定
    // ============================================================
    // 视图切换
    viewBtns.forEach(btn => {
        btn.addEventListener('click', function() {
            viewBtns.forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            currentView = this.dataset.view;
            if (currentView === 'fitting') {
                currentCategory = 'all';
                currentAngle = 'all';
                document.querySelectorAll('#fittingFilterBar .filter-btn[data-type="category"]').forEach(b => b.classList.remove('active'));
                document.querySelector('#fittingFilterBar .filter-btn[data-type="category"][data-value="all"]').classList.add('active');
                document.querySelectorAll('#fittingFilterBar .filter-btn[data-type="angle"]').forEach(b => b.classList.remove('active'));
                document.querySelector('#fittingFilterBar .filter-btn[data-type="angle"][data-value="all"]').classList.add('active');
            }
            if (currentView === 'hose') {
                currentHoseCategory = 'all';
                hoseFilterGroup.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                hoseFilterGroup.querySelector('.filter-btn[data-value="all"]').classList.add('active');
            }
            updateView();
        });
    });

    // 接头筛选按钮
    document.querySelectorAll('#fittingFilterBar .filter-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            if (currentView !== 'fitting') return;
            const type = this.dataset.type;
            const value = this.dataset.value;
            document.querySelectorAll(`#fittingFilterBar .filter-btn[data-type="${type}"]`).forEach(b => b.classList.remove('active'));
            this.classList.add('active');
            if (type === 'category') currentCategory = value;
            else if (type === 'angle') currentAngle = value;
            updateView();
        });
    });

    // ============================================================
    //  初始化 (默认软管)
    // ============================================================
    currentView = 'hose';
    document.querySelector('.view-btn[data-view="hose"]').classList.add('active');
    document.getElementById('hoseFilterBar').classList.add('visible');
    fittingFilterBar.classList.remove('visible');
    currentHoseCategory = 'all';
    hoseFilterGroup.querySelector('.filter-btn[data-value="all"]').classList.add('active');
    updateView();

    console.log(`✅ 软管: ${hoseData.length} 条，接头: ${fittingData.length} 条`);
    console.log('💡 软管分类: 1SN, 2SN, 4SH, 4SP, R15');
</script>
